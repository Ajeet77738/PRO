<!DOCTYPE html>
<html lang="en">
<head>
            <thead>
            <tr>
              <th style="width: 60px;">ID</th>
              <th style="width: 110px;">Choice</th>
              <th>Message</th>
              <th style="width: 160px;">Time</th>
            </tr>
          </thead>
          <tbody id="responses-table-body">
            <tr>
              <td colspan="4" style="text-align: center; color: var(--text-muted);">Loading responses...</td>
            </tr>
          </tbody>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Responses</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="container">
    <!-- Login Section -->
    <section id="login-section" class="card auth-card hidden">
      <h1>Admin Login</h1>
      <div id="login-error" class="error-banner hidden"></div>
      <form id="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
      </form>
    </section>

    <!-- Dashboard Section -->
    <section id="dashboard-section" class="card hidden">
      <header class="dashboard-header">
        <h1>Responses</h1>
        <div class="controls">
          <button id="refresh-btn" class="btn btn-outline">Refresh</button>
          <button id="clear-all-btn" class="btn btn-danger">Clear All</button>
          <button id="logout-btn" class="btn btn-outline">Logout</button>
        </div>
      </header>

      <!-- Stat Counters -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Yes</div>
          <div id="stat-yes" class="stat-value">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Maybe</div>
          <div id="stat-maybe" class="stat-value">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">No</div>
          <div id="stat-no" class="stat-value">-</div>
        </div>
      </div>

      <!-- Tabular Listing -->
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th style="width: 80px;">ID</th>
              <th style="width: 140px;">Choice</th>
              <th>Time</th>
            </tr>
          </thead>
          <tbody id="responses-table-body">
            <tr>
              <td colspan="3" style="text-align: center; color: var(--text-muted);">Loading responses...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js"></script>
</body>
</html>
